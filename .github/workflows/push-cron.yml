name: Protein & Water Push Notifications Cron

on:
  schedule:
    - cron: '0 * * * *' # Hourly check for Water & Protein Reminders
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Send Background Push Notifications
        run: |
          node -e "
          const webpush = require('./frontend/node_modules/web-push');
          const { createClient } = require('./frontend/node_modules/@supabase/supabase-js');

          const supabase = createClient(
            'https://unxmqtyfetbolhgujpma.supabase.co',
            'sb_publishable_nSYm0FRq4v3QlKkiJH54TA_6Bdr_Y5e'
          );

          const VAPID_PUBLIC_KEY = 'BIJKCjc8yN3YsgR-0zFCgSyLAxaQIT9-H4qU0qaIZd9htCr_8GcgtGzrabQJNakqvuk2yFSUqORRM2T8fFFBomo';
          const VAPID_PRIVATE_KEY = 'rshHm2OupT9ROStkNAmiUN59_glpS3nEalsCbHH4K5c';
          const VAPID_SUBJECT = 'mailto:admin@proteintracker.app';

          webpush.setVapidDetails(VAPID_SUBJECT, VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY);

          function getWaterReminder(istHour, name) {
            if (istHour === 11) {
              return {
                title: '💧 Water Check (1.5 Liters)',
                body: \`💧 Hey \${name}! Have you completed 1.5 liters of water so far today? Stay hydrated and keep going!\`,
              };
            }
            if (istHour === 13) {
              return {
                title: '💧 Water Check (2.5 Liters)',
                body: \`💧 Hey \${name}! Time for another water check. Have you drank 1 more liter and reached 2.5 liters today?\`,
              };
            }
            if (istHour === 17) {
              return {
                title: '💧 Water Check (3.0 Liters)',
                body: \`💧 Hey \${name}! Have you completed 3 liters of water intake today? You're doing great—keep it up!\`,
              };
            }
            if (istHour === 21) {
              return {
                title: '💧 Final Water Check (4.0 Liters)',
                body: \`💧 Hey \${name}! Final check for today. Have you completed your 4-liter daily water goal? Finish strong and stay healthy! 💪💧\`,
              };
            }
            return null;
          }

          async function sendPush() {
            const today = new Date().toISOString().slice(0, 10);
            const date = new Date();
            const istHour = parseInt(date.toLocaleTimeString('en-US', { timeZone: 'Asia/Kolkata', hour: '2-digit', hour12: false }), 10);

            const { data: logs } = await supabase.from('consumption_logs').select('user_id').eq('date', today);
            const loggedUserIds = new Set((logs ?? []).map(l => l.user_id));

            const { data: subs } = await supabase.from('push_subscriptions').select('*');
            for (const sub of (subs || [])) {
              const displayNames = { shibin: 'Shibin', niveditha: 'Niveditha', nithin: 'Nithin' };
              const name = displayNames[sub.username.toLowerCase()] || sub.username;
              const pushSubscription = { endpoint: sub.endpoint, keys: { p256dh: sub.p256dh, auth: sub.auth } };

              const payloads = [];
              const waterCheck = getWaterReminder(istHour, name);
              if (waterCheck) payloads.push(waterCheck);

              // Protein Scoop reminder (every 3 hours if not logged today)
              if (!waterCheck && istHour % 3 === 0 && !loggedUserIds.has(sub.user_id)) {
                payloads.push({
                  title: '⏰ Protein Scoop Reminder',
                  body: \`Hey \${name}, don't forget your daily protein scoop! Tap to log +1 scoop ⚡\`,
                });
              }

              for (const payload of payloads) {
                try {
                  const res = await webpush.sendNotification(pushSubscription, JSON.stringify({ ...payload, url: '/' }));
                  console.log('SENT SUCCESS to:', name, 'Title:', payload.title, 'Status:', res.statusCode);
                } catch (err) {
                  console.error('Push err:', err.statusCode, err.message);
                }
              }
            }
          }
          sendPush();
          "
